[project]
name = "vocab"
version = "0.1.0"
description = "CLI word-of-the-day game with spaced repetition"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
markers = ["network: marks tests that make real HTTP calls"]
